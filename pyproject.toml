[project]
name = "devcontainer-python-template"
version = "0.1.0"
description = "Python devcontainer starter template."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Francesco Sodano" }]
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
  "black==26.1.0",
  "mypy==1.19.1",
  "pytest==9.0.2",
]
